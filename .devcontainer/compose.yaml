name: meridian-dev

services:
  dev:
    image: meridian-dev-python:local
    volumes:
      - ..:/workspaces/meridian:cached
    environment:
      DATABASE_URL: postgresql://meridian:meridian@dev-db:5432/meridian_dev
      GACC_TEST_DATABASE_URL: postgresql://meridian_test:meridian_test@test-db:5432/meridian_test
      OLLAMA_HOST: http://host.docker.internal:11434
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHON_DOTENV_DISABLED: "1"
    depends_on:
      dev-db:
        condition: service_healthy
      test-db:
        condition: service_healthy

  dev-db:
    image: postgres:16
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian_dev
    volumes:
      - dev-data:/var/lib/postgresql/data
      - ../schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "meridian", "-d", "meridian_dev"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: meridian_test
      POSTGRES_PASSWORD: meridian_test
      POSTGRES_DB: meridian_test
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ../schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "meridian_test", "-d", "meridian_test"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  dev-data: